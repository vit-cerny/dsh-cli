[package]
name = "dsh-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Native DSH terminal client"
license = "UNLICENSED"
publish = false

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
serde_json = "1"
zstd = "0.13"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"
